[package]
name = "graphite-studio"
version = "0.24.15"
edition = "2021"
rust-version = "1.88"
description = "A modular physically-inspired graphite drawing application"
license = "MIT"

[dependencies]
ahash = "0.8.12"
eframe = { version = "0.35", features = ["glow"] }
egui-wgpu = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rfd = "0.16"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
flate2 = "1.1"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std"] }
bytemuck = "1.25"
pollster = "0.4"

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(windows)'.dependencies]
winit = "0.30"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 2

[patch.crates-io]
# Desktop OpenGL 2.1 fallback for Intel HD 2000/3000 drivers (see vendor/eframe/GRAPHITE-PATCH.md).
eframe = { path = "vendor/eframe" }
